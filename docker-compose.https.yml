# Optional HTTPS with automatic Let's Encrypt certificates (needs a domain pointing at the EC2 IP).
#   DOMAIN=clinical.yourdomain.com docker compose -f docker-compose.yml -f docker-compose.https.yml up -d --build
services:
  frontend:
    ports: !reset []        # Caddy owns ports 80/443 now

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:?set DOMAIN=your.domain}
    volumes:
      - ./infra/ec2/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  caddy_data:
